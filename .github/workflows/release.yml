name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./scripts/package.sh --version "${{ github.ref_name }}" --output-dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Merge checksums
        run: |
          cat dist/checksums.txt | sort -k2 | uniq > dist/checksums-merged.txt
          mv dist/checksums-merged.txt dist/checksums.txt

      - name: Generate release notes
        run: ./scripts/release-notes.sh "${{ github.ref_name }}" dist/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          prerelease=false
          case "${{ github.ref_name }}" in
            *-rc*|*-alpha*|*-beta*|*-dev*)
              prerelease=true
              ;;
          esac

          args=()
          if [ "$prerelease" = true ]; then
            args+=(--prerelease)
          fi

          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file dist/release-notes.md \
              "${args[@]}"
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file dist/release-notes.md \
              "${args[@]}"
          fi

          gh release upload "${{ github.ref_name }}" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt \
            --clobber
